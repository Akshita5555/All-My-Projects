<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Three Divs in Same Line</title>

    <style>
        .container {
            display: flex;
        }

        .box {
            width: 200px;
            height: 100px;
            border: 2px solid black;
            background-color: blue;
            transform: translate(50,20);
            position: relative;
            margin: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box">
            First Div
        </div>

        <div class="box">
            Second Div
        </div>

        <div class="box">
            Third Div
        </div>

    </div>

</body>
</html>
